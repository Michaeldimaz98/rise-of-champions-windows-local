<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rise of Champions</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden">
    <div class="brand"><span class="logo">🏆</span><span id="tb-club">Rise of Champions</span></div>
    <div class="tb-right">
      <span id="tb-cash" class="pill"></span>
      <span id="tb-season" class="pill dim"></span>
      <span id="tb-inbox" class="pill" style="cursor:pointer" onclick="nav('more','inbox')" title="Kotak Masuk">📥</span>
    </div>
  </header>
  <main id="screen"></main>
  <nav id="bottomnav" class="hidden">
    <button data-tab="home" class="active">🏠<small>Beranda</small></button>
    <button data-tab="squad">👥<small>Skuad</small></button>
    <button data-tab="match">⚽<small>Laga</small></button>
    <button data-tab="club">🏟️<small>Klub</small></button>
    <button data-tab="more">☰<small>Lainnya</small></button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="js/app.js"></script>
</body>
</html>
